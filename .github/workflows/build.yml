name: Build

# y2jb_x_update.zip + download0.dat on every branch push and pull request.
# release.yml calls this workflow with the exact release version; tags are
# handled there, not here.
on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: 'Version compiled in (e.g. 1.1.0 or 1.1.1-beta.1). Empty = dev build.'
        type: string
        required: false
        default: ''
    outputs:
      artifact:
        value: ${{ jobs.build.outputs.artifact }}
      elfldr_ver:
        value: ${{ jobs.build.outputs.elfldr_ver }}
      kexp_ver:
        value: ${{ jobs.build.outputs.kexp_ver }}
      autoloader_ver:
        value: ${{ jobs.build.outputs.autoloader_ver }}

concurrency:
  group: build-${{ github.ref }}-${{ inputs.version || 'dev' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' && !inputs.version }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.v.outputs.artifact }}
      elfldr_ver: ${{ steps.build_package.outputs.elfldr_ver }}
      kexp_ver: ${{ steps.build_package.outputs.kexp_ver }}
      autoloader_ver: ${{ steps.build_package.outputs.unified_autoloader_ver }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0   # tags for `git describe` (dev version)

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VER="$INPUT_VERSION"; SUFFIX=""
          else
            VER="$(bash tools/fork_version.sh dev)"; SUFFIX="-$(git rev-parse --short HEAD)"
          fi
          echo "artifact=y2jb-autoloader-x_v${VER}${SUFFIX}_ps5" >> "$GITHUB_OUTPUT"
          echo "X_VERSION=$VER" >> "$GITHUB_ENV"
          echo "Building Y2JB Autoloader X $VER, based on Y2JB Autoloader v$(bash tools/fork_version.sh upstream)"

      - name: Build package
        id: build_package
        run: ./build.sh --download-deps

      - name: Verify version, payload and update file name
        run: |
          set -euo pipefail
          unzip -p y2jb_update.zip main.js > /tmp/main.js
          grep -F "const autoloader_version = \"v${X_VERSION}\";" /tmp/main.js
          grep -F "const upstream_version = \"v$(bash tools/fork_version.sh upstream)\";" /tmp/main.js
          # Our updater must only ever pick up our own zip, never upstream's.
          unzip -p y2jb_update.zip update.js | grep -F 'const UPDATE_ZIP_NAME = "y2jb_x_update.zip";'
          # The bundled unified autoloader must be the -x build (launches Payload Manager X).
          unzip -p y2jb_update.zip ps5-unified-autoloader.elf | strings | grep -m1 "Payload Manager X"

      - name: Prepare download0 directory
        run: |
          mkdir -p download0/cache/splash_screen/aHR0cHM6Ly93d3cueW91dHViZS5jb20vdHY=
          unzip -q y2jb_update.zip -d download0/cache/splash_screen/aHR0cHM6Ly93d3cueW91dHViZS5jb20vdHY=
          rm -f download0/cache/splash_screen/aHR0cHM6Ly93d3cueW91dHViZS5jb20vdHY=/update-info.txt

      - name: Create UFS2 download0.dat in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          copyback: true
          run: |
            set -e

            # 1. Create 336789504 byte image file
            truncate -s 336789504 download0.dat

            # 2. Attach as memory disk (returns e.g. "md0")
            MD=$(mdconfig -a -t vnode -f "$(pwd)/download0.dat")

            # 3. Create UFS2 filesystem
            # -b 32768 (Block size), -f 4096 (Fragment size)
            newfs -O 2 -b 32768 -f 4096 /dev/${MD}

            # 4. Mount
            mount /dev/${MD} /mnt

            # 5. Copy all contents
            cp -R download0/* /mnt/

            # 6. Set permissions
            chmod -R 777 /mnt/*
            chmod 444 /mnt/cache/splash_screen/aHR0cHM6Ly93d3cueW91dHViZS5jb20vdHY=/splash.html

            # 7. Unmount and detach
            umount /mnt
            mdconfig -d -u ${MD}

      - name: Verify image, name the update zip, cleanup
        run: |
          file download0.dat
          rm -rf download0
          # The fork's updater looks for y2jb_x_update.zip (see src/update.js), so
          # it can coexist with upstream's y2jb_update.zip on the same USB drive.
          mv y2jb_update.zip y2jb_x_update.zip

      # download0.dat keeps its name (it is FTPed into /user/download/PPSA0165*/ as-is);
      # the version is in the artifact / release name instead.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.v.outputs.artifact }}
          path: |
            y2jb_x_update.zip
            download0.dat
          retention-days: 30
